spring:
  application:
    name: scalebiometrics-worker-test
  
  profiles:
    active: test
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scalebiometrics_test}
    username: ${DB_USER:test}
    password: ${DB_PASSWORD:test123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: scalebiometrics-worker-test
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 0  # Random port for tests

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: WARN
    com.scalebiometrics: DEBUG
    org.springframework: WARN
    org.springframework.test: DEBUG

# Worker Configuration for Testing
worker:
  hnsw:
    m: 16
    ef-construction: 200
    ef-search: 100
    max-vectors: 10000000
  
  off-heap:
    enabled: true
    max-size-gb: 8
    arena-size-mb: 512
  
  sourceafis:
    enabled: true
    threshold: 40
