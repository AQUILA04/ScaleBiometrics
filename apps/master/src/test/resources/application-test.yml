spring:
  application:
    name: scalebiometrics-master-test
  
  profiles:
    active: test
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scalebiometrics_test}
    username: ${DB_USER:test}
    password: ${DB_PASSWORD:test123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: scalebiometrics-master-test
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 0  # Random port for tests

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: WARN
    com.scalebiometrics: DEBUG
    org.springframework: WARN
    org.springframework.test: DEBUG

# Master Configuration for Testing
master:
  scatter-gather:
    timeout-ms: 1500
    max-parallel-requests: 100
  
  leader-election:
    enabled: true
    lease-duration-ms: 30000
    renew-deadline-ms: 20000
  
  health-monitoring:
    enabled: true
    check-interval-ms: 10000
    heartbeat-timeout-ms: 30000
    consecutive-failures-threshold: 3
  
  circuit-breaker:
    enabled: true
    failure-threshold: 5
    success-threshold: 2
    timeout-ms: 60000
  
  failover:
    enabled: true
    max-recovery-attempts: 3
    initial-recovery-delay-ms: 5000
  
  routing:
    strategy: HASH
    replication-factor: 1
  
  load-balancing:
    enabled: true
    overload-threshold: 1000
    slow-response-threshold-ms: 500
  
  deduplication:
    enabled: true
    ttl-seconds: 300
  
  cache:
    enabled: true
    ttl-seconds: 3600
    max-size: 10000
