input {
  # TCP input for Spring Boot logs
  tcp {
    port => 5000
    codec => json
    type => "java"
  }

  # Syslog input
  syslog {
    port => 5001
    type => "syslog"
  }

  # HTTP input for direct log submission
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Parse Java application logs
  if [type] == "java" {
    # Extract log level
    grok {
      match => { "message" => "%{LOGLEVEL:log_level}" }
      add_tag => [ "java_log" ]
    }

    # Extract timestamp
    date {
      match => [ "timestamp", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
      target => "@timestamp"
    }

    # Parse Spring Boot specific fields
    if [logger_name] =~ /com\.scalebiometrics/ {
      mutate {
        add_field => { "application" => "scalebiometrics" }
      }

      # Extract component from logger name
      grok {
        match => { "logger_name" => "com\.scalebiometrics\.(?<component>\w+)" }
      }

      # Parse matching engine logs
      if [component] == "worker" and [message] =~ /matching/ {
        grok {
          match => {
            "message" => "(?<operation>match1N|match1To1|addFingerprint|removeFingerprint).*latency=(?<latency>\d+)ms.*status=(?<status>\w+)"
          }
        }

        # Convert latency to number
        mutate {
          convert => { "latency" => "integer" }
        }

        # Tag for performance monitoring
        if [latency] > 2000 {
          mutate {
            add_tag => [ "high_latency" ]
          }
        }
      }

      # Parse master orchestrator logs
      if [component] == "master" {
        if [message] =~ /scatter-gather/ {
          grok {
            match => {
              "message" => "scatter-gather.*workers=(?<worker_count>\d+).*timeout=(?<timeout>\d+)ms.*status=(?<status>\w+)"
            }
          }
          mutate {
            convert => { "worker_count" => "integer", "timeout" => "integer" }
          }
        }

        if [message] =~ /circuit-breaker/ {
          grok {
            match => {
              "message" => "circuit-breaker.*worker=(?<worker_id>[\w-]+).*state=(?<cb_state>\w+).*failures=(?<failures>\d+)"
            }
          }
          mutate {
            convert => { "failures" => "integer" }
          }
        }
      }
    }
  }

  # Parse syslog messages
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGLINE}" }
    }
  }

  # Add environment metadata
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:development}"
      "region" => "${REGION:us-east-1}"
      "version" => "${VERSION:0.1.0}"
    }
  }

  # Remove sensitive data
  mutate {
    remove_field => [ "password", "token", "secret", "api_key" ]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "scalebiometrics-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Console output for debugging (development only)
  if [@metadata][debug] {
    stdout {
      codec => rubydebug
    }
  }

  # Conditional outputs based on log level
  if [log_level] == "ERROR" or [log_level] == "FATAL" {
    # Send errors to a separate index for easier alerting
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "scalebiometrics-errors-%{+YYYY.MM.dd}"
    }
  }

  # Tag high latency events
  if "high_latency" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "scalebiometrics-performance-%{+YYYY.MM.dd}"
    }
  }
}
